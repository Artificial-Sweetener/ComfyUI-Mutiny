name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run semantic-release in dry-run mode without publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Install ComfyUI host dependencies for tests
        run: pip install aiohttp

      - name: Install PyTorch CPU wheel
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify JavaScript formatting
        run: npm run format:js:check

      - name: Verify JavaScript lint
        run: npm run lint:js

      - name: Verify Python lint
        run: ruff check .

      - name: Verify tests
        run: pytest

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run --no-ci 2>&1 | tee "$log_file"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            npx semantic-release 2>&1 | tee "$log_file"
            if grep -q "Published release " "$log_file"; then
              echo "released=true" >> "$GITHUB_OUTPUT"
            else
              echo "released=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Sync workspace to released commit
        if: steps.release.outputs.released == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main

      - name: Publish Custom Node to Comfy Registry
        if: steps.release.outputs.released == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          skip_checkout: true
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
